# Render Blueprint for the WorkNest API. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: worknest-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build --workspace backend
    startCommand: npm start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "2"
      - key: JOBS_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ORIGIN_SECRET
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
